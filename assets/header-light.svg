<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="220"
     viewBox="0 0 1000 220" role="img"
     aria-label="Osaid Khan Afridi, AI/ML Engineer">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6F8FA"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E7490"/>
      <stop offset="1" stop-color="#0E7490" stop-opacity="0.15"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0E7490" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#0E7490" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    .edge { stroke: #22A0BD; stroke-opacity: 0.34; stroke-width: 1.1; }
    .edge.live {
      stroke-opacity: 0.95; stroke-width: 1.4;
      stroke-dasharray: 5 95; stroke-dashoffset: 100;
      animation: flow 3.2s linear infinite;
    }
    @keyframes flow { to { stroke-dashoffset: 0; } }

    .node {
      fill: #FFFFFF; stroke: #0E7490; stroke-width: 1.9;
      animation: pulse 3.6s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { stroke-opacity: 0.45; }
      50%      { stroke-opacity: 1; }
    }

    .live-dot { animation: blink 2.4s ease-in-out infinite; }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0.35; }
    }

    .caret { animation: caret 1.1s steps(1) infinite; }
    @keyframes caret { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
  </style>

  <rect width="1000" height="220" rx="14" fill="url(#panel)"/>
  <rect x="0.5" y="0.5" width="999" height="219" rx="13.5"
        fill="none" stroke="#D0D7DE"/>
  <ellipse cx="860" cy="110" rx="260" ry="150" fill="url(#glow)"/>

  <g>
    <line class="edge live" x1="742" y1="62" x2="846" y2="46" style="animation-delay:0.00s"/>
    <line class="edge" x1="742" y1="62" x2="846" y2="94"/>
    <line class="edge" x1="742" y1="62" x2="846" y2="142"/>
    <line class="edge live" x1="742" y1="62" x2="846" y2="182" style="animation-delay:1.35s"/>
    <line class="edge" x1="742" y1="110" x2="846" y2="46"/>
    <line class="edge" x1="742" y1="110" x2="846" y2="94"/>
    <line class="edge live" x1="742" y1="110" x2="846" y2="142" style="animation-delay:2.70s"/>
    <line class="edge" x1="742" y1="110" x2="846" y2="182"/>
    <line class="edge" x1="742" y1="158" x2="846" y2="46"/>
    <line class="edge live" x1="742" y1="158" x2="846" y2="94" style="animation-delay:0.90s"/>
    <line class="edge" x1="742" y1="158" x2="846" y2="142"/>
    <line class="edge" x1="742" y1="158" x2="846" y2="182"/>
    <line class="edge live" x1="846" y1="46" x2="946" y2="86" style="animation-delay:2.25s"/>
    <line class="edge" x1="846" y1="46" x2="946" y2="138"/>
    <line class="edge" x1="846" y1="94" x2="946" y2="86"/>
    <line class="edge live" x1="846" y1="94" x2="946" y2="138" style="animation-delay:0.45s"/>
    <line class="edge" x1="846" y1="142" x2="946" y2="86"/>
    <line class="edge" x1="846" y1="142" x2="946" y2="138"/>
    <line class="edge live" x1="846" y1="182" x2="946" y2="86" style="animation-delay:1.80s"/>
    <line class="edge" x1="846" y1="182" x2="946" y2="138"/>
    <circle class="node" cx="742" cy="62" r="5.5" style="animation-delay:0.00s"/>
    <circle class="node" cx="742" cy="110" r="5.5" style="animation-delay:0.32s"/>
    <circle class="node" cx="742" cy="158" r="5.5" style="animation-delay:0.64s"/>
    <circle class="node" cx="846" cy="46" r="5.5" style="animation-delay:0.96s"/>
    <circle class="node" cx="846" cy="94" r="5.5" style="animation-delay:1.28s"/>
    <circle class="node" cx="846" cy="142" r="5.5" style="animation-delay:1.60s"/>
    <circle class="node" cx="846" cy="182" r="5.5" style="animation-delay:1.92s"/>
    <circle class="node" cx="946" cy="86" r="5.5" style="animation-delay:2.24s"/>
    <circle class="node" cx="946" cy="138" r="5.5" style="animation-delay:2.56s"/>
  </g>

  <rect x="44" y="50" width="3" height="104" rx="1.5" fill="url(#bar)"/>

  <text x="68" y="84" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="40" font-weight="700"
        letter-spacing="1.5" fill="#1F2328">Osaid Khan Afridi</text>
  <text x="70" y="115" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="600"
        letter-spacing="4.2" fill="#0E7490">AI / ML  ENGINEER</text>
  <text x="70" y="147" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15"
        fill="#59636E">Agentic systems, RAG and computer vision — shipped to production.</text>

  <g transform="translate(68, 170)">
    <rect width="404" height="30" rx="15" fill="#0E7490" fill-opacity="0.08"
          stroke="#0E7490" stroke-opacity="0.35"/>
    <circle class="live-dot" cx="18" cy="15" r="4" fill="#1A7F37"/>
    <text x="32" y="20" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#59636E">
      open to full-time AI/ML roles · Pakistan &amp; remote<tspan class="caret"
      fill="#0E7490" dx="4">_</tspan></text>
  </g>
</svg>
